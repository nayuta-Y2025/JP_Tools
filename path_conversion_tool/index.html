<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パス変換ツール</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 1.5rem;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 1.2rem; /* サイズを大きく */
      font-weight: bold;
      margin-bottom: 15px;
      background: #e0e0e0;
      color: #666;
    }
    .status-mac { background: #000; color: #fff; }
    .status-win { background: #0078d4; color: #fff; }

    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    textarea:focus {
      outline: none;
      border-color: #007aff;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn-convert {
      background-color: #007aff;
      color: white;
      font-size: 1.2rem; /* さらに大きめに */
      padding: 18px;
    }
    .btn-copy {
      background-color: #34c759;
      color: white;
    }
    .btn-clear, .btn-copy {
      background-color: #eee;
      color: #333;
    }
    .btn-all {
      background-color: #ff9500;
      color: white;
      font-size: 1.2rem;
      padding: 18px;
    }
    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Win ←→ Mac パス変換</h2>
    <div id="status" class="status-badge">形式を判別中...</div>
    <textarea id="pathBox" rows="5" placeholder="パスを貼り付けてください..." oninput="updateStatus()"></textarea>
    
    <div class="button-group">
      <button class="btn-convert" onclick="toggleConvert()">変換する</button>
      <button class="btn-copy" onclick="copyToClipboard()">コピー</button>
      <button class="btn-clear" onclick="clearAll()">クリア</button>
    </div>
    <div class="button-group">
      <button class="btn-all" onclick="convertCopyClear()">変換 → コピー → クリア（一括）</button>
    </div>
  </div>

  <script>
    const pathBox = document.getElementById("pathBox");
    const statusEl = document.getElementById("status");

    function updateStatus() {
      // 最初の一行を取り出して判定
      const lines = pathBox.value.split('\n').map(l => l.trim().replace(/^["']|["']$/g, '')).filter(l => l);
      
      if (lines.length === 0) {
        statusEl.innerText = "待機中";
        statusEl.className = "status-badge";
        return;
      }

      const path = lines[0];
      if (path.startsWith('\\\\') || path.includes('\\')) {
        statusEl.innerText = "Windows形式";
        statusEl.className = "status-badge status-win";
      } else if (path.startsWith('/Volumes/') || path.includes('/')) {
        statusEl.innerText = "Mac形式";
        statusEl.className = "status-badge status-mac";
      }
    }

    function toggleConvert() {
      const rawInput = pathBox.value.trim();
      if (!rawInput) return;

      const lines = rawInput.split('\n').map(l => l.trim().replace(/^["']|["']$/g, ''));
      
      // 最初の一行で変換方向を決定
      const isWindows = lines[0].startsWith('\\\\') || lines[0].includes('\\');
      
      const convertedLines = lines.map(line => {
        if (!line) return "";
        return isWindows ? getMacPath(line) : getWinPath(line);
      });

      pathBox.value = convertedLines.join('\n');
      updateStatus();
    }

    // 変換ロジックの核となる関数 (Macへ)
    function getMacPath(input) {
      let macPath = input;
      if (macPath.startsWith('/Volumes/')) return macPath;
      
      macPath = macPath.replace(/\\/g, '/');
      const serverMatch = macPath.match(/^\/\/([^\/]+)\/(.+)/);
      if (serverMatch && serverMatch[2]) {
          macPath = '/Volumes/' + serverMatch[2];
      }
      return macPath.replace(/\/\//g, '/');
    }

    // 変換ロジックの核となる関数 (Winへ)
    function getWinPath(input) {
      let winPath = input.normalize('NFC');
      const volumesMatch = winPath.match(/^\/Volumes\/(.+)/);
      if (volumesMatch && volumesMatch[1]) {
          winPath = '\\\\172.21.50.2\\' + volumesMatch[1];
      } else {
          winPath = winPath.replace(/\//g, '\\');
      }
      return winPath.replace(/\//g, '\\');
    }

    function copyToClipboard() {
      if (!pathBox.value) return;
      navigator.clipboard.writeText(pathBox.value).then(() => {
        const originalText = statusEl.innerText;
        statusEl.innerText = "コピーしました！";
        setTimeout(() => {
          updateStatus();
        }, 2000);
      });
    }

    function clearAll() {
      pathBox.value = "";
      updateStatus();
    }

    function convertCopyClear() {
      if (!pathBox.value.trim()) return;
      toggleConvert();
      navigator.clipboard.writeText(pathBox.value).then(() => {
        pathBox.value = "";
        statusEl.innerText = "コピーしてクリアしました！";
        statusEl.className = "status-badge";
        setTimeout(() => {
          updateStatus();
        }, 2000);
      });
    }
  </script>
</body>
</html>
