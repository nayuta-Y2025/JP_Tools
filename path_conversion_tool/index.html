<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パス変換ツール</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 1.5rem;
      text-align: center;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 10px;
      background: #e0e0e0;
      color: #666;
    }
    .status-mac { background: #000; color: #fff; }
    .status-win { background: #0078d4; color: #fff; }

    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    textarea:focus {
      outline: none;
      border-color: #007aff;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn-convert {
      background-color: #007aff;
      color: white;
    }
    .btn-clear {
      background-color: #eee;
      color: #333;
    }
    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Path Converter</h2>
    <div id="status" class="status-badge">形式を判別中...</div>
    <textarea id="pathBox" rows="5" placeholder="パスを貼り付けてください..." oninput="updateStatus()"></textarea>
    
    <div class="button-group">
      <button class="btn-convert" onclick="toggleConvert()">変換する</button>
      <button class="btn-clear" onclick="clearAll()">クリア</button>
    </div>
  </div>

  <script>
    const pathBox = document.getElementById("pathBox");
    const statusEl = document.getElementById("status");

    function updateStatus() {
      const path = pathBox.value.trim();
      if (!path) {
        statusEl.innerText = "待機中";
        statusEl.className = "status-badge";
        return;
      }
      if (path.startsWith('\\\\') || path.includes('\\')) {
        statusEl.innerText = "Windows形式";
        statusEl.className = "status-badge status-win";
      } else if (path.startsWith('/Volumes/') || path.includes('/')) {
        statusEl.innerText = "Mac形式";
        statusEl.className = "status-badge status-mac";
      }
    }

    function toggleConvert() {
      const input = pathBox.value.trim();
      if (!input) return;

      // Windows形式かMac形式かを判定して逆の方へ変換
      if (input.startsWith('\\\\') || input.includes('\\')) {
        convertToMac(input);
      } else {
        convertToWindows(input);
      }
      updateStatus();
    }

    function convertToMac(input) {
      let macPath = input;
      if (macPath.startsWith('/Volumes/')) {
          pathBox.value = macPath;
          return;
      }
      macPath = macPath.replace(/\\/g, '/');
      macPath = macPath.replace(/^[A-Z]:/, '');
      const uncMatch = macPath.match(/^\/\/[^\/]+\/(.+)/);
      if (uncMatch && uncMatch[1]) {
          macPath = '/Volumes/' + uncMatch[1];
      }
      macPath = macPath.replace(/\/\//g, '/');
      pathBox.value = macPath;
    }

    function convertToWindows(input) {
      let winPath = input.normalize('NFC');
      if (winPath.startsWith('\\\\')) {
          pathBox.value = winPath;
          return;
      }
      const volumesMatch = winPath.match(/^\/Volumes\/(.+)/);
      if (volumesMatch && volumesMatch[1]) {
          winPath = '\\\\172.21.50.2\\' + volumesMatch[1];
      } else {
          winPath = winPath.replace(/\//g, '\\');
           if (winPath.startsWith('\\') && !winPath.includes(':')) {
              winPath = "C:" + winPath;
           }
      }
      winPath = winPath.replace(/\//g, '\\');
      pathBox.value = winPath;
    }

    function clearAll() {
      pathBox.value = "";
      updateStatus();
    }
  </script>
</body>
</html>
